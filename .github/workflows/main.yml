name: Deploy Quartz Site

on:
  push:
    branches: ["main"] # The branch you push your source files to

jobs:
  build_and_deploy:
    # This environment is needed for GitHub Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    # 📝 FIX: Updated permissions for security and proper deployment.
    permissions:
      contents: read # Only read access is needed for the build step
      pages: write # Needed to deploy the site
      id-token: write # Needed for OIDC authentication by actions/deploy-pages
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # === QUARTZ BUILD STEP ===
      - name: Build Quartz for GitHub Pages
        # Use the specific action you were using
        uses: konstfish/quartz-build-action@v6
        with:
          source: ./
          destination: ./_site
          page_title: "Jaden's University Notes"
          page_base_url: https://JadenMajid.github.io/UniversityNotes/
      # === END BUILD STEP ===

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match the 'destination' path above
          path: './_site' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
